<div class="mb-3">
    <label class="erp-form-label">Supplier Name *</label>
    <input type="text" name="name" class="erp-input" required>
</div>
<div class="row g-2">
    <div class="col-6">
        <label class="erp-form-label">Contact Person</label>
        <input type="text" name="contact" class="erp-input">
    </div>
    <div class="col-6">
        <label class="erp-form-label">Phone</label>
        <input type="text" name="phone" class="erp-input">
    </div>
</div>
<div class="mt-2">
    <label class="erp-form-label">Email</label>
    <input type="email" name="email" class="erp-input">
</div>
<div class="mt-2">
    <label class="erp-form-label">Address</label>
    <textarea name="address" class="erp-input" rows="2"></textarea>
</div>
<div class="mt-2">
    <label class="erp-form-label">Notes</label>
    <textarea name="notes" class="erp-input" rows="2"></textarea>
</div>
