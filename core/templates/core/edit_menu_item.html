{% extends 'erp_base.html' %}

{% block content %}
<div class="animate-fade-in">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-5 gap-3">
        <div>
            <h1 class="section-title mb-1">Edit Menu Item</h1>
            <p class="text-secondary mb-0">Updating: <span class="fw-bold text-dark">{{ menu_item.name }}</span></p>
        </div>
        <div>
            <a href="{% url 'manage_menu' %}" class="btn btn-outline-dark">Cancel & Go Back</a>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4 p-md-5">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="row g-4">
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-secondary">Item Name</label>
                                <input type="text" name="name" class="form-control form-control-lg" value="{{ menu_item.name }}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-secondary">Price (EGP)</label>
                                <input type="number" step="0.01" name="price" class="form-control form-control-lg" value="{{ menu_item.price|stringformat:'.2f' }}" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label small fw-bold text-secondary">Description</label>
                                <textarea name="description" class="form-control" rows="3">{{ menu_item.description }}</textarea>
                            </div>
                            <div class="col-12">
                                <label class="form-label small fw-bold text-secondary">Image URL</label>
                                <input type="url" name="image_url" class="form-control" value="{{ menu_item.image_url|default:'' }}">
                                {% if menu_item.image_url %}
                                <div class="mt-2">
                                    <img src="{{ menu_item.image_url }}" alt="Preview" class="rounded-3 shadow-sm" style="max-height: 100px;">
                                </div>
                                {% endif %}
                            </div>
                            <div class="col-12">
                                <label class="form-label small fw-bold text-secondary">Category (Optional)</label>
                                <select name="category" class="form-select rounded-3">
                                    <option value="">— No Category —</option>
                                    {% for cat in categories %}
                                    <option value="{{ cat.id }}" {% if menu_item.category and menu_item.category.id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-12">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" name="is_active" id="isActive" {% if menu_item.is_active %}checked{% endif %}>
                                    <label class="form-check-label small fw-bold text-secondary" for="isActive">Item is Active & Visible in POS</label>
                                </div>
                            </div>

                            <div class="col-12">
                                <hr class="my-4">
                                <h5 class="fw-bold mb-4">Recipe / Ingredients</h5>
                                <div id="ingredient-rows">
                                    {% for current in current_ingredients %}
                                    <div class="ingredient-row row g-3 mb-3 align-items-center">
                                        <div class="col-5">
                                            <label class="form-label small text-secondary">Ingredient</label>
                                            <select name="ingredients" class="form-select">
                                                <option value="">Select Ingredient</option>
                                                {% for ing in ingredients %}
                                                <option value="{{ ing.id }}" {% if current.ingredient.id == ing.id %}selected{% endif %}>
                                                    {{ ing.name }}
                                                </option>
                                                {% endfor %}
                                            </select>
                                        </div>
                                        <div class="col-3">
                                            <label class="form-label small text-secondary">Unit</label>
                                            <select name="recipe_units" class="form-select">
                                                <option value="g" {% if current.recipe_unit == 'g' %}selected{% endif %}>grams (g)</option>
                                                <option value="mL" {% if current.recipe_unit == 'mL' %}selected{% endif %}>milliliters (mL)</option>
                                                <option value="packets" {% if current.recipe_unit == 'packets' %}selected{% endif %}>packets</option>
                                                <option value="cans" {% if current.recipe_unit == 'cans' %}selected{% endif %}>cans</option>
                                                <option value="pieces" {% if current.recipe_unit == 'pieces' %}selected{% endif %}>pieces</option>
                                            </select>
                                        </div>
                                        <div class="col-2">
                                            <label class="form-label small text-secondary">Qty</label>
                                            <input type="number" step="0.001" min="0" name="quantities" class="form-control" value="{{ current.quantity_required|stringformat:'g' }}">
                                        </div>
                                        <div class="col-2 pt-4">
                                            <button type="button" class="btn btn-outline-danger w-100" onclick="this.parentElement.parentElement.remove()">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </div>
                                    </div>
                                    {% empty %}
                                    <div class="ingredient-row row g-3 mb-3 align-items-center">
                                        <div class="col-5">
                                            <label class="form-label small text-secondary">Ingredient</label>
                                            <select name="ingredients" class="form-select">
                                                <option value="">Select Ingredient</option>
                                                {% for ing in ingredients %}
                                                <option value="{{ ing.id }}">{{ ing.name }}</option>
                                                {% endfor %}
                                            </select>
                                        </div>
                                        <div class="col-3">
                                            <label class="form-label small text-secondary">Unit</label>
                                            <select name="recipe_units" class="form-select">
                                                <option value="g" {% if current.recipe_unit == 'g' %}selected{% endif %}>grams (g)</option>
                                                <option value="mL" {% if current.recipe_unit == 'mL' %}selected{% endif %}>milliliters (mL)</option>
                                                <option value="packets" {% if current.recipe_unit == 'packets' %}selected{% endif %}>packets</option>
                                                <option value="cans" {% if current.recipe_unit == 'cans' %}selected{% endif %}>cans</option>
                                                <option value="pieces" {% if current.recipe_unit == 'pieces' %}selected{% endif %}>pieces</option>
                                            </select>
                                        </div>
                                        <div class="col-2">
                                            <label class="form-label small text-secondary">Qty</label>
                                            <input type="number" step="0.001" min="0" name="quantities" class="form-control" placeholder="0.000">
                                        </div>
                                        <div class="col-2 pt-4">
                                            <button type="button" class="btn btn-outline-danger w-100" onclick="this.parentElement.parentElement.remove()">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </div>
                                    </div>
                                    {% endfor %}
                                </div>
                                <button type="button" class="btn btn-light rounded-pill px-4 mt-3" onclick="addIngredientRow()">
                                    <i class="bi bi-plus-circle me-1"></i> Add Another Ingredient
                                </button>
                            </div>

                            <div class="col-12 mt-5">
                                <button type="submit" class="btn btn-vibrant btn-lg w-100 py-3">Update Menu Item</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>


<script>
// For boxes, allowed recipe unit = ingredient.sub_unit (cans or packets)
const STATIC_FAMILIES = {
    'kg':     ['g'],
    'L':      ['mL'],
    'pieces': ['pieces'],
};
const UNIT_LABELS = {
    'g':       'grams (g)',
    'mL':      'milliliters (mL)',
    'pieces':  'pieces',
    'packets': 'packets',
    'cans':    'cans',
};
// ingredient id -> {unit, sub_unit}
const ING_UNITS = {
    {% for ing in ingredients %}"{{ ing.id }}": {"unit": "{{ ing.unit }}", "sub": "{{ ing.sub_unit }}"}{% if not forloop.last %},{% endif %}
    {% endfor %}
};

function getAllowedUnits(ingId) {
    if (!ingId || !ING_UNITS[ingId]) return Object.keys(UNIT_LABELS);
    const d = ING_UNITS[ingId];
    if (d.unit === 'boxes') return [d.sub];
    return STATIC_FAMILIES[d.unit] || ['pieces'];
}

function updateRecipeUnits(row, keepValue) {
    const ingSelect  = row.querySelector('select[name="ingredients"]');
    const unitSelect = row.querySelector('select[name="recipe_units"]');
    if (!unitSelect) return;
    const prevVal = keepValue !== undefined ? keepValue : unitSelect.value;
    unitSelect.innerHTML = '';
    getAllowedUnits(ingSelect.value).forEach(val => {
        const opt = new Option(UNIT_LABELS[val] || val, val);
        if (val === prevVal) opt.selected = true;
        unitSelect.appendChild(opt);
    });
}

function wireRow(row) {
    const ingSelect = row.querySelector('select[name="ingredients"]');
    ingSelect.addEventListener('change', () => updateRecipeUnits(row));
    if (ingSelect.value) updateRecipeUnits(row, row.querySelector('select[name="recipe_units"]').value);
}

document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.ingredient-row').forEach(wireRow);
});

function addIngredientRow() {
    const container = document.getElementById('ingredient-rows');
    const firstRow  = container.querySelector('.ingredient-row');
    const newRow    = firstRow.cloneNode(true);
    newRow.querySelectorAll('select').forEach(s => s.selectedIndex = 0);
    newRow.querySelectorAll('input[type="number"]').forEach(i => i.value = '');
    container.appendChild(newRow);
    wireRow(newRow);
    updateRecipeUnits(newRow);
}
</script>
{% endblock %}
