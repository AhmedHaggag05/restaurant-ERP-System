<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 — Server Error | Searing Sandwiches</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f5f7; font-family: 'Segoe UI', sans-serif; }
        .err-card { background: white; border-radius: 16px; padding: 3rem; max-width: 480px; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
        .err-code { font-size: 5rem; font-weight: 900; color: #FF4500; line-height: 1; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
    <div class="err-card text-center">
        <div class="err-code">500</div>
        <h2 class="fw-bold mt-2 mb-3">Server Error</h2>
        <p class="text-muted mb-4">Something went wrong on our end. Please try again shortly.</p>
        <a href="/" class="btn btn-danger rounded-pill px-4">Go to Dashboard</a>
    </div>
</body>
</html>
